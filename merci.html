<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merci pour votre demande | Sahara Moto Ride</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--primary:#B4552D;--secondary:#E4D5BE;--sand:#FAF6EF;--dark:#26201A;--cta:#C2410C;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;color:var(--dark);background:var(--sand);}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
.card{max-width:512px;display:flex;flex-direction:column;align-items:center;gap:16px;}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(28px,4.5vw,38px);line-height:1.15;margin:0;color:var(--dark);}
p{font-size:16px;line-height:1.6;color:#3A322A;margin:0;}
.call-btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:16px 32px;border-radius:8px;text-decoration:none;font-weight:600;font-size:16px;background:var(--dark);color:#fff;margin-top:8px;}
.home-link{font-size:14px;color:var(--primary);text-decoration:underline;margin-top:4px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Merci pour votre demande.</h1>
      <p>Votre message a bien été reçu. Nous revenons vers vous sous 24 heures afin d'évaluer votre profil et vous transmettre les informations détaillées.</p>
      <p>Pour un échange plus direct, vous pouvez également nous appeler.</p>
      <a href="tel:+41764584143" class="call-btn">Appeler maintenant</a>
      <a href="index.html" class="home-link">Retour à l'accueil</a>
    </div>
  </div>
</body>
</html>
